<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stadium Gate Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #080c14;
    --surface:  #0e1420;
    --border:   #1c2535;
    --normal:   #00e87a;
    --busy:     #f5a623;
    --critical: #f56023;
    --overflow: #f52323;
    --text:     #c8d4e8;
    --dim:      #4a5a72;
    --accent:   #3d8fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(61,143,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,143,255,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .wrapper { position: relative; z-index: 1; padding: 24px; max-width: 1400px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, #1a3060, #0f1e40);
    border: 1px solid #2a4080;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; color: #e8f0ff; }
  h1 span { color: var(--accent); }

  .live-badge {
    display: flex; align-items: center; gap: 7px;
    background: rgba(0,232,122,.08); border: 1px solid rgba(0,232,122,.2);
    padding: 6px 14px; border-radius: 20px;
    font-size: .78rem; font-weight: 600; color: var(--normal);
    font-family: 'JetBrains Mono', monospace;
  }

  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--normal);
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .4; transform: scale(.7); }
  }

  .summary-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 14px; margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
    position: relative; overflow: hidden;
  }

  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%; background: var(--accent);
    border-radius: 12px 0 0 12px;
  }

  .stat-label { font-size: .72rem; color: var(--dim); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .8px; }
  .stat-value { font-size: 1.9rem; font-weight: 700; color: #e8f0ff; line-height: 1; font-family: 'JetBrains Mono', monospace; }
  .stat-sub   { font-size: .72rem; color: var(--dim); margin-top: 4px; }

  .gates-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-bottom: 24px;
  }

  .gate-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
    transition: border-color .3s, box-shadow .3s;
  }

  .gate-card.NORMAL   { border-color: rgba(0,232,122,.25); }
  .gate-card.BUSY     { border-color: rgba(245,166,35,.25); }
  .gate-card.CRITICAL { border-color: rgba(245,96,35,.4); box-shadow: 0 0 20px rgba(245,96,35,.1); }
  .gate-card.OVERFLOW { border-color: rgba(245,35,35,.5); box-shadow: 0 0 30px rgba(245,35,35,.15); animation: flicker .8s ease-in-out infinite alternate; }

  @keyframes flicker {
    from { box-shadow: 0 0 20px rgba(245,35,35,.1); }
    to   { box-shadow: 0 0 40px rgba(245,35,35,.3); }
  }

  .gate-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }

  .gate-name { font-size: 1.6rem; font-weight: 700; color: #e8f0ff; font-family: 'JetBrains Mono', monospace; }

  .status-badge { font-size: .68rem; font-weight: 600; padding: 3px 10px; border-radius: 12px; letter-spacing: .5px; }
  .status-badge.NORMAL   { background: rgba(0,232,122,.12);  color: var(--normal); }
  .status-badge.BUSY     { background: rgba(245,166,35,.12); color: var(--busy); }
  .status-badge.CRITICAL { background: rgba(245,96,35,.15);  color: var(--critical); }
  .status-badge.OVERFLOW { background: rgba(245,35,35,.18);  color: var(--overflow); }

  .count-display { font-size: 2.4rem; font-weight: 700; color: #fff; font-family: 'JetBrains Mono', monospace; line-height: 1; margin-bottom: 4px; }
  .count-of { font-size: .8rem; color: var(--dim); margin-bottom: 12px; }

  .fill-bar { height: 6px; background: rgba(255,255,255,.07); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .fill-progress { height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .NORMAL   .fill-progress { background: var(--normal); }
  .BUSY     .fill-progress { background: var(--busy); }
  .CRITICAL .fill-progress { background: var(--critical); }
  .OVERFLOW .fill-progress { background: var(--overflow); }

  .gate-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

  .mini-stat { background: rgba(255,255,255,.03); border-radius: 8px; padding: 8px 10px; }
  .mini-stat-label { font-size: .65rem; color: var(--dim); }
  .mini-stat-value { font-size: .95rem; font-weight: 600; color: #c8d4e8; font-family: 'JetBrains Mono', monospace; }

  .gate-alert {
    margin-top: 12px; padding: 10px 12px;
    background: rgba(245,35,35,.08); border: 1px solid rgba(245,35,35,.3);
    border-radius: 8px; font-size: .78rem; font-weight: 600;
    color: #ff7070; line-height: 1.4; animation: slideIn .3s ease;
  }

  .redirect-badge {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 5px 12px;
    background: rgba(0,232,122,.1); border: 1px solid rgba(0,232,122,.3);
    border-radius: 8px; font-size: .75rem; font-weight: 700; color: var(--normal);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bottom-grid { display: grid; grid-template-columns: 1fr 380px; gap: 16px; }

  .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }

  .section-title {
    font-size: .78rem; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--dim);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }

  .alert-list { display: flex; flex-direction: column; gap: 10px; }

  .alert-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px; border-radius: 10px;
    background: rgba(255,255,255,.02); border: 1px solid transparent;
    animation: fadeIn .4s ease;
  }
  .alert-item.CROWDING { border-color: rgba(245,35,35,.2); }
  .alert-item.OVERFLOW { border-color: rgba(245,96,35,.2); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .alert-time { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--dim); white-space: nowrap; margin-top: 2px; }
  .alert-gate { background: rgba(61,143,255,.15); color: var(--accent); font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .alert-msg  { font-size: .82rem; color: var(--text); line-height: 1.4; }
  .no-alerts  { color: var(--dim); font-size: .85rem; text-align: center; padding: 20px 0; }

  .staff-list { display: flex; flex-direction: column; gap: 12px; }

  .staff-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: rgba(255,255,255,.02); border-radius: 10px;
    border: 1px solid var(--border);
  }

  .staff-gate  { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1rem; color: #e8f0ff; }
  .staff-count { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--text); }
  .staff-icons { display: flex; gap: 3px; }
  .staff-icon  { font-size: 1rem; }
  .staff-num   { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.1rem; color: var(--accent); }

  .timestamp { text-align: center; margin-top: 16px; font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--dim); }

  @media (max-width: 900px) {
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
    .gates-grid  { grid-template-columns: repeat(2, 1fr); }
    .bottom-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .gates-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo">
      <div class="logo-icon">🏟</div>
      <div>
        <h1>Gate <span>Monitor</span></h1>
        <div style="font-size:.7rem;color:var(--dim);margin-top:2px">Stadium Smart Control</div>
      </div>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span id="timestamp">--:--:--</span>
    </div>
  </header>

  <div class="summary-bar">
    <div class="stat-card">
      <div class="stat-label">Total In</div>
      <div class="stat-value" id="total-in">0</div>
      <div class="stat-sub" id="total-expected">of 0 expected</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Entry Rate</div>
      <div class="stat-value" id="entry-pct">0%</div>
      <div class="stat-sub">of total capacity</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ETA</div>
      <div class="stat-value" id="eta">--</div>
      <div class="stat-sub">minutes remaining</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Alerts</div>
      <div class="stat-value" id="active-alerts" style="color:var(--overflow)">0</div>
      <div class="stat-sub">gates need action</div>
    </div>
  </div>

  <div class="gates-grid" id="gates-grid"></div>

  <div class="bottom-grid">
    <div class="section-card">
      <div class="section-title">Alert Log</div>
      <div class="alert-list" id="alerts-log">
        <div class="no-alerts">No alerts yet ✓</div>
      </div>
    </div>
    <div class="section-card">
      <div class="section-title">Suggested Staff Distribution</div>
      <div class="staff-list" id="staff-list"></div>
    </div>
  </div>

  <div class="timestamp" id="footer-time">Last update: --</div>

</div>

<script>
const API = "http://localhost:5000/api/status";

const STATUS_LABEL = {
  NORMAL:   "Normal",
  BUSY:     "Busy",
  CRITICAL: "Critical",
  OVERFLOW: "Overflow",
};

function buildGateCard(g) {
  const fillW = Math.min(g.occupancy, 100);
  const alertHTML = g.alert ? `
    <div class="gate-alert">${g.alert}
      ${g.redirect_to ? `<div class="redirect-badge">↗ Move to Gate ${g.redirect_to}</div>` : ""}
    </div>` : "";

  return `
    <div class="gate-card ${g.status}">
      <div class="gate-header">
        <div class="gate-name">Gate ${g.name}</div>
        <div class="status-badge ${g.status}">${STATUS_LABEL[g.status]}</div>
      </div>
      <div class="count-display">${g.count}</div>
      <div class="count-of">of ${g.capacity} — ${g.occupancy.toFixed(0)}%</div>
      <div class="fill-bar">
        <div class="fill-progress" style="width:${fillW}%"></div>
      </div>
      <div class="gate-stats">
        <div class="mini-stat">
          <div class="mini-stat-label">Entry Rate</div>
          <div class="mini-stat-value">${g.entry_rate}/min</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">Staff Needed</div>
          <div class="mini-stat-value">${g.recommended_staff} 👷</div>
        </div>
      </div>
      ${alertHTML}
    </div>`;
}

function buildStaffRow(g) {
  const icons = Array(Math.min(g.recommended_staff, 6))
    .fill('<span class="staff-icon">👷</span>').join("");
  return `
    <div class="staff-row">
      <div class="staff-gate">Gate ${g.name}</div>
      <div class="staff-count">
        <div class="staff-icons">${icons}</div>
        <div class="staff-num">${g.recommended_staff}</div>
      </div>
    </div>`;
}

function buildAlertItem(a) {
  return `
    <div class="alert-item ${a.type}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <div class="alert-gate">${a.gate}</div>
        <div class="alert-time">${a.time}</div>
      </div>
      <div class="alert-msg">${a.message}</div>
    </div>`;
}

async function fetchAndRender() {
  try {
    const res  = await fetch(API);
    const data = await res.json();

    document.getElementById("total-in").textContent      = data.total_in;
    document.getElementById("total-expected").textContent = `of ${data.total_expected} expected`;
    document.getElementById("entry-pct").textContent     = `${((data.total_in / data.total_expected) * 100).toFixed(0)}%`;
    document.getElementById("eta").textContent           = data.eta_minutes;
    document.getElementById("timestamp").textContent     = data.timestamp;
    document.getElementById("footer-time").textContent   = `Last update: ${data.timestamp}`;

    const activeAlerts = data.gates.filter(g => g.alert).length;
    document.getElementById("active-alerts").textContent = activeAlerts;

    document.getElementById("gates-grid").innerHTML = data.gates.map(buildGateCard).join("");
    document.getElementById("staff-list").innerHTML = data.gates.map(buildStaffRow).join("");

    const log = data.alerts_log;
    document.getElementById("alerts-log").innerHTML = log.length
      ? log.map(buildAlertItem).join("")
      : '<div class="no-alerts">No alerts yet ✓</div>';

  } catch {
    document.getElementById("timestamp").textContent = "⚠ no connection";
  }
}

fetchAndRender();
setInterval(fetchAndRender, 2000);
</script>
</body>
</html>
